<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orbitus · Treino</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: one mobile-first column (max 760px), sticky header with countdown + day switcher + tabs, rest timer docked to the bottom edge. Iron-and-chalk palette: cool graphite neutrals, cobalt for action, amber for the clock. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E2E7EC; --ink:#131A21; --ink-2:#4B5661; --line:#D2D9E0;
  --accent:#2747D6; --accent-ink:#FFFFFF; --accent-soft:#DDE3FA;
  --amber:#A86200; --amber-soft:#FAEBD0;
  --good:#1D7444; --good-soft:#D5EEDF; --bad:#B42318; --bad-soft:#F8DDDA;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1216; --surface:#161C22; --surface-2:#1F262D; --ink:#E6EBF0; --ink-2:#97A2AD; --line:#2A333C;
  --accent:#7E94FF; --accent-ink:#0B1020; --accent-soft:#1C2446;
  --amber:#F0B347; --amber-soft:#3A2B11;
  --good:#4FC585; --good-soft:#123322; --bad:#FF7B6F; --bad-soft:#3E1B17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#161C22; --surface-2:#1F262D; --ink:#E6EBF0; --ink-2:#97A2AD; --line:#2A333C;
  --accent:#7E94FF; --accent-ink:#0B1020; --accent-soft:#1C2446;
  --amber:#F0B347; --amber-soft:#3A2B11;
  --good:#4FC585; --good-soft:#123322; --bad:#FF7B6F; --bad-soft:#3E1B17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.timing{padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:28px;text-transform:uppercase}
.count{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.count b{font-family:var(--f-display);font-size:34px;line-height:.9;color:var(--accent)}
.count span{font-size:12px;color:var(--ink-2)}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datebar .d{font-weight:500;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;font-size:18px;line-height:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sync{margin-left:auto;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local i{background:var(--amber)}
.sync.busy i{background:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:none;padding:10px 12px 11px;font-family:var(--f-display);font-size:17px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:22px;text-transform:uppercase}
.card h3{font-size:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* inputs */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12px;font-weight:500;color:var(--ink-2)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.wide{width:100%}

/* score / checklist */
.scorehead{display:flex;align-items:center;gap:16px}
.pips{display:flex;gap:6px}
.pip{width:26px;height:10px;border-radius:3px;background:var(--surface-2)}
.pip.on{background:var(--accent)}
.score-n{font-family:var(--f-display);font-size:44px;line-height:.9}
.check{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:500}
.dot.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.dot.no{border-color:var(--bad);color:var(--bad)}
.check b{display:block}
.check small{color:var(--ink-2);font-size:13px}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.toggle.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cups{display:flex;gap:4px;flex-wrap:wrap}
.cup{width:26px;height:30px;border-radius:4px 4px 8px 8px;border:1.5px solid var(--line);background:transparent}
.cup.on{background:var(--accent-soft);border-color:var(--accent)}
.note{border-radius:8px;padding:12px 14px;font-size:14px;background:var(--surface-2)}
.note.amber{background:var(--amber-soft);color:var(--ink)}
.note.good{background:var(--good-soft)}
.note.bad{background:var(--bad-soft)}
.note b{font-weight:500}

/* bars */
.bar{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden}
.bar > i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar.over > i{background:var(--bad)}
.barline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}

/* workout */
.session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.session-head h2{font-size:30px}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.prog .bar{flex:1}
.ss{border:1px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px}
.ss-label{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:0 4px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.complete{border-color:var(--good)}
.ex-top{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;align-items:start}
.ex-title{display:flex;gap:8px;align-items:flex-start;min-width:0}
.fig{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.ex.zoom .ex-top{grid-template-columns:minmax(0,1fr)}
.ex.zoom .fig{cursor:zoom-out;max-width:420px}
.ex-links{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px}
.vid{font-size:13px;font-weight:500;color:var(--accent);text-decoration:none}
.vid:hover{text-decoration:underline}
@media (max-width:420px){.ex-top{grid-template-columns:104px minmax(0,1fr)}}
.tag{font-family:var(--f-display);font-weight:500;font-size:15px;background:var(--ink);color:var(--surface);border-radius:6px;padding:2px 7px;flex:none}
.ex-name{font-weight:500;font-size:16px;line-height:1.25}
.ex-meta{font-size:13px;color:var(--ink-2)}
.ex-tip{font-size:13px;color:var(--ink-2)}
.sugg{font-size:13px;border-radius:6px;padding:7px 10px;background:var(--surface-2)}
.sugg.up{background:var(--good-soft);color:var(--ink)}
.sugg.up b{color:var(--good)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.set.nokg{grid-template-columns:24px minmax(0,1fr) 44px}
.set .sn{font-family:var(--f-mono);color:var(--ink-2);font-size:13px;text-align:center}
.set label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;min-width:0}
.set label span{font-size:11px;font-weight:500;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.set label input{border:0;background:transparent;width:100%;min-width:0;padding:8px 0;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums;outline:none}
.set label:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.set.done label{background:var(--good-soft);border-color:transparent}
.chk{width:44px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:500;color:var(--ink-2)}
.set.done .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.block{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* nutrition */
.meal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal b{display:block}
.meal p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.meal .mac{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.add{border-style:dashed}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.extra{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.extra button{border:0;background:none;color:var(--ink-2);font-size:18px;padding:0 4px}
.custom{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end}
@media (max-width:480px){.custom{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.custom .field:first-child{grid-column:1/-1}}
ol.rules,ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* measures */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:30px;line-height:1}
.kpi .v small{font-size:16px;color:var(--ink-2)}
.kpi .d{font-size:12px;font-family:var(--f-mono)}
.down{color:var(--good)}.upc{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-family:var(--f-mono);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:500}
td{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:var(--accent-soft)}
.heat{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.heat .hd{font-size:11px;color:var(--ink-2);text-align:center;font-weight:500;text-transform:uppercase}
.heat .wk{font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
.cell{aspect-ratio:1.6;max-width:100%;border-radius:5px;border:0;background:var(--surface-2);font-size:10px;font-family:var(--f-mono);color:var(--ink-2);padding:0}
.cell.s1{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2))}
.cell.s2{background:color-mix(in srgb,var(--accent) 36%,var(--surface-2))}
.cell.s3{background:color-mix(in srgb,var(--accent) 56%,var(--surface-2));color:var(--ink)}
.cell.s4{background:color-mix(in srgb,var(--accent) 78%,var(--surface-2));color:var(--accent-ink)}
.cell.s5{background:var(--accent);color:var(--accent-ink)}
.cell.trip{outline:1.5px dashed var(--amber);outline-offset:-2px}
.cell.today{box-shadow:0 0 0 2px var(--ink)}
.cell.out{opacity:.35}

/* timer */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
#timer .wrap{padding-block:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
#timer .tl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;opacity:.8}
#timer .tt{font-family:var(--f-display);font-size:44px;line-height:.9;color:var(--amber)}
#timer.hard .tt{color:var(--bad)}
#timer .tb{grid-column:1/-1;height:4px;background:rgba(127,127,127,.35);border-radius:2px;overflow:hidden}
#timer .tb i{display:block;height:100%;background:var(--amber)}
#timer .tc{display:flex;gap:6px}
#timer .tc button{border:1px solid rgba(127,127,127,.5);background:transparent;color:var(--surface);border-radius:8px;padding:8px 10px;font-weight:500;font-size:13px}
/* coaching */
.quote{font-family:var(--f-display);font-size:19px;line-height:1.2;letter-spacing:.01em;color:var(--ink-2);text-wrap:balance}
.reminders{display:flex;flex-direction:column;gap:8px}
.remind{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.remind span{flex:1 1 220px;min-width:0}
.sugg.down{background:var(--amber-soft)}
.sugg.down b{color:var(--amber)}
.set.timed{grid-template-columns:24px minmax(0,1fr) 44px 44px}
.chk.play{color:var(--accent);border-color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.trend{font-weight:500}.trend.up{color:var(--good)}.trend.down{color:var(--bad)}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:"▸ ";color:var(--ink-2)}
details.card[open] summary::before{content:"▾ "}
.coach{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.coach-out{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px 14px;line-height:1.5}
.btn[disabled]{opacity:.6;cursor:default}
.swap summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2)}
/* meals */
.meal-b{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.meal-b:first-child{border-top:0}
.meal-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.meal-h p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.meal-btns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.editor{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.editor .inp,.editor .pin{background:var(--surface)}
.mi{display:grid;grid-template-columns:minmax(0,1fr) 96px auto 28px;gap:8px;align-items:center;padding:4px 0}
.mi-n{font-size:14px;font-weight:500;min-width:0}
.xbtn{border:0;background:none;font-size:20px;color:var(--ink-2);padding:0}
.picker summary{cursor:pointer;font-weight:500;font-size:14px;color:var(--accent)}
.buy-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.buy-btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:480px){.meal-h{grid-template-columns:minmax(0,1fr)}.meal-btns{flex-direction:row;flex-wrap:wrap}.mi{grid-template-columns:minmax(0,1fr) 88px 28px}.mi .mono{grid-column:1/2;grid-row:2}}
/* pantry */
.pantry-row{display:grid;grid-template-columns:minmax(0,1fr) 108px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pin{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px}
.pin input{border:0;background:transparent;width:100%;min-width:0;padding:7px 0;font-family:var(--f-mono);font-size:15px;outline:none;text-align:right}
.pin span{font-size:11px;font-weight:500;color:var(--ink-2)}
.pin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toggle[disabled]{opacity:.4;cursor:default}
textarea.inp{resize:vertical}
@media (max-width:420px){.pantry-row{grid-template-columns:minmax(0,1fr) 92px}.pantry-row .toggle{grid-column:1/-1;justify-self:start}}
/* game */
.lvl{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;width:100%;text-align:left}
.lvl .lv{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lvl .bar{flex:1;height:6px}
.lvl .xp{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.xpchips{display:flex;flex-wrap:wrap;gap:6px}
.xpchip{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--ink);font-weight:500}
.xpchip b{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.levelcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.medal{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:44px;font-weight:500;box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.lvname{font-family:var(--f-display);font-size:30px;text-transform:uppercase;line-height:1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-width:0}
.badge .bi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--ink-2)}
.badge.on{border-color:var(--accent)}
.badge.on .bi{background:var(--accent);color:var(--accent-ink)}
.badge b{font-size:14px;line-height:1.2}
.badge small{font-size:12px;color:var(--ink-2);line-height:1.3}
.badge:not(.on){opacity:.72}
.chal{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.chal:first-of-type{border-top:0}
.chal .wk{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.pill{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.flame{font-family:var(--f-display);font-size:56px;line-height:.9;color:var(--amber)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
body.timing #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
.toast{background:var(--ink);color:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.big{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;text-align:center}
.toast .mono{color:var(--amber)}
.toast.big .mono{color:inherit}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  if(!m)return null;let n=m[1];n=EST_NUM[n]!=null?EST_NUM[n]:+n.replace(',','.');return {n,u:(m[2]||'').replace(/s$/,'')}}
function estimarLocal(txt){
  const partes=estNorm(txt).split(/,|;|\+|\n|\be\b|\bcom\b|\bmais\b/).map(s=>s.trim()).filter(Boolean),itens=[],nao=[];
  partes.forEach(pt=>{let hit=null,len=0;
    EST_SIN.forEach(([id,ws])=>ws.forEach(w=>{if(new RegExp('\\b'+w+'\\b').test(pt)&&w.length>len){hit={id};len=w.length}}));
    EST_EXTRA.forEach(([ws,n,v,def])=>ws.forEach(w=>{if(new RegExp('\\b'+w+'\\b').test(pt)&&w.length>len){hit={x:[n,v,def]};len=w.length}}));
    if(!hit){if(/[a-z]{3}/.test(pt))nao.push(pt);return}
    const q=estQtd(pt),G={fatia:0,colher:0,col:0,concha:100,xicara:160,copo:200,pote:170,file:120,bife:120,pedaco:60,porcao:0};
    if(hit.x){const [n,v,def]=hit.x;let g;if(v.u){const c=q&&!/g|kg/.test(q.u)?q.n:1;itens.push({nome:n,food:null,q:c,kcal:Math.round(v.u*c),proteina_g:Math.round(v.p*c)});return}
      g=!q?def:q.u==='kg'?q.n*1000:/^(g|gr|grama|ml)$/.test(q.u)?q.n:q.u==='fatia'?q.n*20:/col/.test(q.u)?q.n*15:q.n*def;
      itens.push({nome:n,food:null,q:g,kcal:Math.round(v.g*g/100),proteina_g:Math.round(v.p*g/100)});return}
    const F=FOODS[hit.id];let v;
    if(F.u==='g'){const porFatia={queijo:20,carne:100,frango:100,peixe:100},porCol={arroz:25,feijao:25,legumes:20,leite:15};
      v=!q?(hit.id==='legumes'?50:F.def):q.u==='kg'?q.n*1000:/^(g|gr|grama|ml)$/.test(q.u)?q.n:q.u==='fatia'?q.n*(porFatia[hit.id]||25):/col/.test(q.u)?q.n*(porCol[hit.id]||20):G[q.u]?q.n*G[q.u]:q.n*F.def}
    else{v=!q?F.def:/^(g|gr|grama)$/.test(q.u)?(hit.id==='whey'?q.n/30:hit.id==='aveia'?q.n/10:hit.id==='azeite'?q.n/10:q.n/50):q.n}
    itens.push({nome:F.n,food:hit.id,q:Math.round(v*10)/10})});
  return {itens,nao}}

function nutrition(d){let p=0,kc=0,doce=0,doceExtra=0,fora=0;
  MEALS.forEach(m=>{const v=d.meals&&d.meals[m.id];if(!v)return;if(v===true){p+=m.p;kc+=m.k}else{const r=mealNutr(v);p+=r.p;kc+=r.k}});p=Math.round(p);kc=Math.round(kc);

function lastSets(id,k){const keys=Object.keys(S.days).filter(x=>x<k).sort().reverse();
  for(const x of keys){const s=(S.days[x].workout&&S.days[x].workout.sets||{})[id];if(s&&s.some(r=>r&&r.done))return {date:x,sets:s.filter(r=>r&&r.done)}}return null}
function suggest(ex,k){
  const L=lastSets(ex.id,k);
  const unitWord=ex.unit==='s'?'segundos':'reps';
  if(!L)return {kg:ex.kg,st:'new',html:ex.kg!=null?`<b>Carga inicial sugerida: ${ex.kg} kg</b> (${ex.per}). Ajuste na 1ª sessão: as 2 últimas reps devem ser difíceis.`:`Comece na faixa de ${ex.lo}–${ex.hi} ${unitWord} com ${ex.load}.`};
  const reps=L.sets.map(r=>num(r.reps)||0);
  const allTop=L.sets.length>=ex.s&&reps.every(r=>r>=ex.hi);
  const lowN=reps.filter(r=>r<ex.lo).length;
  const last=`${fmtShort(L.date)}: ${ex.kg!=null?((modeKg(L.sets)??ex.kg)+' kg × '):''}${reps.join(' · ')}`;
  if(ex.kg==null&&lowN>=2)return {kg:null,st:'down',html:`Última ${last}. <b>Abaixo da faixa: use a versão mais fácil</b> (${ex.load==='elástico'?'elástico mais leve':'apoio dos joelhos ou amplitude menor'}).`};
  if(ex.kg==null)return {kg:null,st:allTop?'up':'keep',html:allTop?`Última ${last}. <b>Topo batido: aumente a dificuldade</b> (${ex.load==='elástico'?'elástico mais forte':'mais carga ou pausa'}).`:`Última ${last}. Busque +1 ${ex.unit==='s'?'5 s':'rep'} por série.`};
  const lastKg=modeKg(L.sets)||ex.kg;
  if(lowN>=2){const step=lastKg<=10?1:2;const nk=Math.max(1,lastKg-step);return {kg:nk,st:'down',html:`Última ${last}. <b>${lowN} séries abaixo de ${ex.lo} reps: reduza para ${nk} kg</b> e acerte a técnica.`}}
  if(allTop){const step=ex.step||(lastKg<10?1:2);const nk=lastKg+step;
    if(lastKg>=(ex.max||32))return {kg:32,st:'up',html:`Última ${last}. <b>Halter no máximo.</b> Desça mais devagar (3 s) ou adicione 2 reps.`};
    return {kg:nk,st:'up',html:`Última ${last}. <b>Topo batido: suba para ${nk} kg.</b>`}}
  return {kg:lastKg,st:'keep',html:`Última ${last}. Mantenha ${lastKg} kg e busque ${ex.hi} reps em todas.`};
}

function desenharAgentes(t){
  document.querySelectorAll('canvas.agf').forEach(cv=>{const r=cv.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
    let it=AGC.get(cv);if(!it){const sd=hashAg(cv.dataset.seed),W=cv.clientWidth;it={P:formaAg(cv.dataset.forma,sd,W>48?900:520),rx:.35+(sd%100)/250,ry:(sd%628)/100,dir:sd%2?1:-1,k:2+sd%3,m:2+(sd>>3)%3,c:cv.dataset.cor.split(',').map(Number),vaga:cv.classList.contains('vaga')};AGC.set(cv,it)}
    const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    const R=W*.38*(1+.025*Math.sin(t*.9+it.ry)),cx=W/2,cy=H/2,sa=Math.sin(it.rx),ca=Math.cos(it.rx),yr=it.ry+t*.06*it.dir,sb=Math.sin(yr),cb=Math.cos(yr),k=it.vaga?.35:1,c=it.c;
    for(const p of it.P){let x,y,z;if(p.onda){const rr=1+.22*Math.sin(it.k*p.v+t*.7)*Math.sin(it.m*p.u+t*.45);x=rr*Math.sin(p.u)*Math.cos(p.v);y=rr*Math.cos(p.u);z=rr*Math.sin(p.u)*Math.sin(p.v)}
      else{const w=p.j?Math.sin(t*1.1+p.ph)*p.j:0;x=p.x+w;y=p.y+w*.7;z=p.z-w*.5}
      const x1=x*cb+z*sb,z1=-x*sb+z*cb,y1=y*ca-z1*sa,z2=y*sa+z1*ca,pf=2.8/(2.8-z2),al=(.22+.55*(z2+1)/2)*p.b*k,sz=(.6+.6*(z2+1)/2)*(p.b>1?1.2:1);
      g.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${Math.min(1,al).toFixed(3)})`;g.fillRect(cx+x1*R*pf,cy+y1*R*pf,sz,sz)}})}

function chart(o){
  const W=680,H=o.h||220,m={l:40,r:12,t:12,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const span=diffDays(o.x0,o.x1);
  const X=k=>m.l+diffDays(o.x0,k)/span*iw;
  const vals=[];(o.points||[]).forEach(p=>vals.push(p.v));(o.lines||[]).forEach(l=>l.pts.forEach(p=>vals.push(p.v)));(o.band||[]).forEach(p=>{vals.push(p.lo,p.hi)});
  let y0=Math.floor(Math.min(...vals)-o.pad),y1=Math.ceil(Math.max(...vals)+o.pad);if(y1-y0<3)y1=y0+3;
  const Y=v=>m.t+(1-(v-y0)/(y1-y0))*ih;
  const stepY=(y1-y0)>8?2:1;
  let g='';
  for(let v=y0;v<=y1;v+=stepY)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  for(let k=mondayOf(o.x0);k<=o.x1;k=addDays(k,7)){if(k<o.x0)continue;g+=`<line x1="${X(k)}" x2="${X(k)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${X(k)}" y="${H-8}" text-anchor="middle">${fmtShort(k)}</text>`}
  if(o.band&&o.band.length){const top=o.band.map(p=>`${X(p.k)},${Y(p.hi)}`).join(' ');const bot=o.band.slice().reverse().map(p=>`${X(p.k)},${Y(p.lo)}`).join(' ');g+=`<polygon points="${top} ${bot}" fill="var(--good)" fill-opacity=".14" stroke="none"/>`}
  (o.lines||[]).forEach(l=>{if(l.pts.length>1)g+=`<polyline points="${l.pts.map(p=>`${X(p.k)},${Y(p.v)}`).join(' ')}" fill="none" stroke="${l.c}" stroke-width="${l.w||2}" ${l.dash?`stroke-dasharray="${l.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`});
  (o.marks||[]).forEach(mk=>{g+=`<circle cx="${X(mk.k)}" cy="${Y(mk.v)}" r="4" fill="var(--surface)" stroke="var(--amber)" stroke-width="2"/><text x="${X(mk.k)}" y="${Y(mk.v)-9}" text-anchor="middle" style="fill:var(--amber)">${mk.t}</text>`});
  (o.points||[]).forEach((p,i,a)=>{const last=i===a.length-1;g+=`<circle cx="${X(p.k)}" cy="${Y(p.v)}" r="${last?5:3}" fill="${p.base?'var(--surface)':(o.pc||'var(--ink-2)')}" stroke="${o.pc||'var(--ink-2)'}" stroke-width="${p.base?2:1}"/>`;if(last&&!p.base)g+=`<text x="${Math.min(X(p.k)+8,W-m.r-30)}" y="${Y(p.v)-8}" style="fill:var(--ink);font-weight:500">${f1(p.v)}</text>`});
  const tk=todayKey();if(tk>=o.x0&&tk<=o.x1)g+=`<line x1="${X(tk)}" x2="${X(tk)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--accent)" stroke-width="1.5"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}
function weekRows(){
  const rows=[];let k=PLAN.gridStart;const t=todayKey();
  for(let w=1;w<=7;w++){
    const end=addDays(k,6);const ks=Array.from({length:7},(_,i)=>addDays(k,i));
    const ws=ks.map(x=>S.days[x]&&S.days[x].weight).filter(v=>v!=null);
    const wa=ks.map(x=>S.days[x]&&S.days[x].waist).filter(v=>v!=null);
    const st=ks.map(x=>S.days[x]&&S.days[x].steps).filter(v=>v!=null);
    const tr=ks.filter(x=>S.days[x]&&S.days[x].workout&&S.days[x].workout.done).length;
    const sc=ks.map(score).filter(v=>v!=null);
    rows.push({w,k,end,cur:t>=k&&t<=end,past:end<t,weight:ws.length?ws.reduce((a,b)=>a+b,0)/ws.length:null,waist:wa.length?wa[wa.length-1]:null,steps:st.length?st.reduce((a,b)=>a+b,0)/st.length:null,treinos:tr,adh:sc.length?sc.reduce((a,b)=>a+b,0)/sc.length/5*100:null});
    k=addDays(k,7);
  }
  return rows;
}
function verdict(rows){
  const done=rows.filter(r=>r.past&&r.weight!=null);
  if(done.length<2)return {c:'',t:'<b>Regra de ajuste:</b> o veredito aparece depois de 2 domingos com peso e cintura registrados. Pese e meça sempre nas mesmas condições: domingo, em jejum, depois do banheiro.'};
  const a=done[done.length-2],b=done[done.length-1];
  const prev=rows[a.w-2];const baseA=prev&&prev.weight!=null?prev.weight:PLAN.weight;
  const dA=a.weight-baseA,dB=b.weight-a.weight;
  const waistStuck=(b.waist==null||a.waist==null)?null:(b.waist-a.waist)>-0.3;
  if(dB<-1.0)return {c:'amber',t:`<b>Rápido demais:</b> ${f1(dB)} kg na última semana. Acima de 1 kg por semana, parte é músculo. Some ~150 kcal (carboidrato no almoço).`};
  if(dA>-0.3&&dB>-0.3&&waistStuck!==false)return {c:'bad',t:`<b>Hora de ajustar:</b> duas semanas com média caindo menos de 0,3 kg${waistStuck?' e cintura parada':''}. Primeiro some 2.000 passos/dia. Se em 2 semanas não mudar, corte ~150 kcal tirando o carboidrato do jantar. Nunca os dois juntos.`};
  if(dB>-0.3&&waistStuck===false)return {c:'good',t:'<b>Está funcionando:</b> a balança parou, mas a cintura caiu. Isso é ganho de músculo. Não mexa em nada.'};
  return {c:'good',t:`<b>No ritmo:</b> ${f1(dB)} kg na última semana. Mantenha tudo como está.`};
}

function challengeState(i){const c=CHALLENGES[i];const k0=addDays(PLAN.gridStart,i*7);const ks=Array.from({length:7},(_,j)=>addDays(k0,j));const t=todayKey();
  const prog=c.f(ks);const end=ks[6];const failed=c.fail&&c.fail(ks);
  const st=prog>=c.goal&&!failed?'done':(failed||end<t?'missed':(k0>t?'next':'live'));
  return {c,k0,end,prog:Math.min(prog,c.goal),st}}

function seqMax(pred){let best=0,cur=0;const t=todayKey();eachDay(k=>{if(pred(k)){cur++;if(cur>best)best=cur}else if(k!==t)cur=0});return best}
function countDays(pred,from=PLAN.gridStart,to=todayKey()){let n=0;for(let k=from;k<=to;k=addDays(k,1))if(pred(k))n++;return n}

function adherence(){const t=todayKey();const end=t<PLAN.trip?addDays(t,-1):addDays(PLAN.trip,-1);if(end<PLAN.start)return null;let sum=0,n=0;for(let k=PLAN.start;k<=end;k=addDays(k,1)){sum+=score(k)||0;n++}return n?sum/(n*5)*100:null}
function totalXP(){let x=0;for(const k in S.days)x+=dayXP(k).total;CHALLENGES.forEach((c,i)=>{if(challengeState(i).st==='done')x+=100});return x}
function levelOf(x){let i=0;for(let j=0;j<LEVELS.length;j++)if(x>=LEVELS[j][0])i=j;const cur=LEVELS[i],nxt=LEVELS[i+1];return {n:i+1,name:cur[1],from:cur[0],to:nxt?nxt[0]:null,next:nxt?nxt[1]:null}}
function gameSnap(){const xp=totalXP();return {xp,lvl:levelOf(xp).n,badges:BADGES.filter(b=>b.ok()).map(b=>b.id)}}
function toast(html,big){const box=document.getElementById('toast');const el=document.createElement('div');el.className='toast'+(big?' big':'');el.innerHTML=html;box.appendChild(el);setTimeout(()=>el.remove(),big?3600:2000)}
function gameFeedback(a,b){
  const dx=b.xp-a.xp;if(dx>0)toast(`<span class="mono">+${dx} XP</span>`);
  if(b.lvl>a.lvl){const L=levelOf(b.xp);toast(`Nível ${L.n}<br>${esc(L.name)}`,true)}
  b.badges.filter(id=>!a.badges.includes(id)).forEach(id=>{const B=BADGES.find(x=>x.id===id);toast(`Conquista desbloqueada<br>${esc(B.n)}`,true)});
}
function lvlStrip(){const x=totalXP(),L=levelOf(x);const pct=L.to?Math.round((x-L.from)/(L.to-L.from)*100):100;
  return `<button class="lvl" data-act="tab" data-tab="jornada" aria-label="Abrir jornada"><span class="lv">Nv ${L.n} · ${esc(L.name)}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="xp">${f0(x)} XP</span></button>`}
function xpTodayCard(k){const r=dayXP(k);const d=getDay(k);const n=nutrition(d);const allMeals=MEALS.every(m=>(d.meals||{})[m.id]);
  const low=n.logged&&n.kc<1650&&(k<todayKey()||allMeals);
  return `<section class="card"><div class="block"><div><div class="eyebrow">XP do dia</div><div class="score-n num" style="font-size:36px">${r.total}<span class="muted" style="font-size:18px"> XP</span></div></div>
    <button class="toggle" data-act="tab" data-tab="jornada">Ver jornada</button></div>
    ${r.items.length?`<div class="xpchips">${r.items.map(([l,x])=>`<span class="xpchip">${esc(l)} <b>+${x}</b></span>`).join('')}</div>`:`<div class="small muted">Nada pontuado ainda. Registre o café da manhã e a água para começar.</div>`}
    ${low?`<div class="note bad"><b>Abaixo de 1.650 kcal não pontua.</b> Déficit agressivo consome músculo e costuma acabar em compulsão. Coma o plano inteiro.</div>`:''}
  </section>`}
function xpBars(){const t=todayKey();const ks=Array.from({length:14},(_,i)=>addDays(t,i-13));const vals=ks.map(k=>dayXP(k).total);const mx=Math.max(160,...vals);
  const W=680,H=170,m={l:8,r:8,t:16,b:24},bw=(W-m.l-m.r)/14;
  let g=`<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--line)"/>`;
  const y100=H-m.b-100/mx*(H-m.t-m.b);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y100}" y2="${y100}" stroke="var(--amber)" stroke-dasharray="4 4"/><text x="${W-m.r}" y="${y100-4}" text-anchor="end" style="fill:var(--amber)">100 XP · bom dia</text>`;
  ks.forEach((k,i)=>{const v=vals[i];const h=v/mx*(H-m.t-m.b);const x=m.l+i*bw+bw*0.18;const w=bw*0.64;
    g+=`<rect x="${x}" y="${H-m.b-h}" width="${w}" height="${Math.max(h,0)}" rx="3" fill="${k===t?'var(--accent)':'color-mix(in srgb,var(--accent) 55%,var(--surface-2))'}"/>`;
    if(v)g+=`<text x="${x+w/2}" y="${H-m.b-h-4}" text-anchor="middle">${v}</text>`;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${dateOf(k).getDate()}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="XP dos últimos 14 dias">${g}</svg>`}
function viewJornada(){

      <div class="bar"><i style="width:${pct}%"></i></div>

  <div class="grid2">

    <section class="card"><div class="eyebrow">Missão 12/12</div><div class="flame num" style="color:var(--accent)">${left>0?'D-'+left:'OK'}</div>
      <div class="small muted">Aderência média até agora: <b class="num" style="color:var(--ink)">${adh!=null?Math.round(adh)+'%':'–'}</b>. A conquista Embarque pede 75% ou mais.</div></section>
  </div>

  ${live?`<section class="card"><div class="block"><div><div class="eyebrow">Desafio da semana · ${fmtShort(live.k0)}–${fmtShort(live.end)}</div><h2>${esc(live.c.n)}</h2></div><span class="pill acc">+100 XP</span></div>

  <section class="card"><h2>XP dos últimos 14 dias</h2>${xpBars()}</section>

    <div class="badges">${BADGES.map(b=>{const on=b.ok();return `<div class="badge ${on?'on':''}"><span class="bi">${esc(b.i)}</span><b>${esc(b.n)}</b><small>${esc(b.d)}</small></div>`}).join('')}</div></section>

  <section class="card"><h2>Desafios</h2><div>${cs.map((s,i)=>`<div class="chal"><span class="wk">S${i+1}</span><div><b>${esc(s.c.n)}</b><div class="small muted">${esc(s.c.d)} · ${s.prog}/${s.c.goal}</div></div>${pillOf(s.st)}</div>`).join('')}</div></section>

  <section class="card"><h2>Como ganhar XP</h2>

}

function modeKg(sets){const c={};sets.forEach(r=>{const v=num(r.kg);if(v!=null)c[v]=(c[v]||0)+1});let best=null,bn=0;for(const v in c){if(c[v]>bn||(c[v]===bn&&+v<best)){best=+v;bn=c[v]}}return best}
function sessionVolume(k){const d=getDay(k);let v=0;for(const id in (d.workout.sets||{})){(d.workout.sets[id]||[]).forEach(r=>{if(r&&r.done&&num(r.kg)!=null&&num(r.reps)!=null)v+=num(r.kg)*num(r.reps)})}return v}
function prevSameSession(k){const sk=sessionKey(k);const keys=Object.keys(S.days).filter(x=>x<k).sort().reverse();for(const x of keys){if(sessionKey(x)===sk&&sessionVolume(x)>0)return x}return null}
function workoutSummary(k){
  const d=getDay(k),sk=sessionKey(k),t=T_[sk];const tot=sessionTotals(k);if(!tot.done)return '';
  const rows=[];let up=0,down=0,keep=0;
  t.items.forEach(([id])=>{const ex=EX[id];const done=((d.workout.sets||{})[id]||[]).filter(r=>r&&r.done);if(!done.length)return;
    const nx=suggest(ex,addDays(k,1));const used=ex.kg!=null?modeKg(done):null;
    if(nx.st==='up')up++;else if(nx.st==='down')down++;else keep++;
    rows.push({ex,used,reps:done.map(r=>num(r.reps)??'–'),nx})});
  const vol=sessionVolume(k),pk=prevSameSession(k),pv=pk?sessionVolume(pk):0,dv=pv?((vol-pv)/pv*100):null;
  const prs=dayPRs(k).length;
  const tips=[];
  if(!d.workout.warm)tips.push('Você pulou o aquecimento. Aos 42 anos, 5 min de remo leve antes de carga pesada reduzem bastante o risco de lesão.');
  if(down>=2)tips.push(`${down} exercícios ficaram abaixo da faixa de reps. Carga alta demais: já reduzi para a próxima sessão. Técnica limpa primeiro.`);
  if(up>=Math.max(2,Math.ceil(rows.length/2)))tips.push(`${up} exercícios bateram o topo. Progressão forte: suba a carga, mas sem piorar a execução.`);
  if(dv!=null&&dv<-10)tips.push(`O volume caiu ${f0(Math.abs(dv))}% em relação ao último treino ${LETTER_LABEL[sk]}. Sono curto ou pouca comida ontem costumam ser a causa.`);
  if(tot.done<tot.total&&d.workout.done)tips.push(`Treino encerrado com ${tot.done} de ${tot.total} séries. Vale como treino mínimo; só não deixe virar padrão.`);
  if(!tips.length)tips.push('Treino sólido e sem alertas. Repita a dose na próxima sessão com as cargas indicadas abaixo.');
  const ico={up:'↑',down:'↓',keep:'=',new:'='};
  return `<section class="card"><div class="block"><div><div class="eyebrow">Avaliação do treino</div><h2>Balanço e próximas cargas</h2></div>${prs?`<span class="pill good">${prs} recorde${prs>1?'s':''}</span>`:''}</div>
    <div class="grid4">
      <div class="kpi"><span class="eyebrow">Séries</span><span class="v num">${tot.done}<small>/${tot.total}</small></span></div>
      <div class="kpi"><span class="eyebrow">Volume</span><span class="v num">${f0(vol)}<small> kg</small></span><span class="d ${dv!=null?(dv>=0?'down':'upc'):''}">${dv!=null?(dv>=0?'+':'')+f0(dv)+'% vs '+fmtShort(pk):'1ª vez nesta sessão'}</span></div>
      <div class="kpi"><span class="eyebrow">Subir</span><span class="v num" style="color:var(--good)">${up}</span></div>
      <div class="kpi"><span class="eyebrow">Reduzir</span><span class="v num" style="color:${down?'var(--bad)':'var(--ink)'}">${down}</span></div>
    </div>
    <div class="tablewrap"><table style="min-width:420px"><thead><tr><th>Exercício</th><th>Hoje</th><th>Próxima</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.ex.n)}</td><td class="mono">${r.used!=null?r.used+' kg × ':''}${r.reps.join(' · ')}</td><td class="mono"><span class="trend ${r.nx.st}">${ico[r.nx.st]||'='}</span> ${r.nx.kg!=null?r.nx.kg+' kg':(r.nx.st==='up'?'mais difícil':r.nx.st==='down'?'versão fácil':'manter')}</td></tr>`).join('')}

}

function dayReviewItems(k){

  if(sk!=='R'&&!workoutOk(k))it.push({ok:false,t:'<b>Treino não feito.</b> Amanhã, treine antes de abrir o computador. Se o dia apertar, faça o treino mínimo.'});

  if(n.p<PLAN.proteinOk)it.push({ok:false,t:`<b>Faltaram ${PLAN.protein-n.p} g de proteína.</b> Amanhã: 2 claras a mais no café e whey ou iogurte proteico no lanche.`});
  else it.push({ok:true,t:`<b>Proteína em dia</b> (${n.p} g).`});
  if(!n.logged)it.push({ok:false,t:'<b>Refeições não registradas.</b> Sem registro, as calorias viram chute. Marque as refeições na aba Alimentação.'});
  else if(n.kc>PLAN.kcalCap){const ex=(d.extras||[]).map(x=>x.n);it.push({ok:false,t:`<b>${f0(n.kc-PLAN.kcal)} kcal acima da meta.</b> ${ex.length?'Vieram de: '+esc(ex.join(', '))+'.':''} Uma vez não muda nada; o padrão é que importa.`})}
  else if(n.kc<1650)it.push({ok:false,t:`<b>Comeu pouco (${f0(n.kc)} kcal).</b> Abaixo de 1.650 você perde músculo e aumenta a chance de compulsão. Coma o plano inteiro.`});
  else it.push({ok:true,t:`<b>Calorias na meta</b> (${f0(n.kc)} kcal).`});
  if(d.steps==null)it.push({ok:false,t:'<b>Passos não registrados.</b> Copie do app Atividade.'});
  else if(d.steps<stepsGoal(k)){const miss=stepsGoal(k)-d.steps;it.push({ok:false,t:`<b>Faltaram ${f0(miss)} passos</b>, uns ${f0(miss/110)} min de caminhada. Amanhã: 15 min depois do almoço e 15 depois do jantar.`})}
  else it.push({ok:true,t:`<b>Passos na meta</b> (${f0(d.steps)}).`});
  if(n.doceExtra)it.push({ok:false,t:'<b>Doce fora do plano.</b> Na próxima vontade, use a sobremesa proteica e confira se a proteína do dia estava baixa.'});
  if(d.sleep!=null&&d.sleep<7)it.push({ok:false,t:`<b>Dormiu ${f1(d.sleep)} h.</b> Sono curto aumenta a fome no dia seguinte. Proteja a hora de deitar hoje.`});

  return it;
}

function itemNutr(it){if(it.f){const F=FOODS[it.f];if(!F)return {k:0,p:0};const m=F.u==='g'?(it.q||0)/100:(it.q||0);return {k:F.k*m,p:F.p*m}}return {k:+it.k||0,p:+it.p||0}}
function mealNutr(rec){let k=0,p=0;(rec.items||[]).forEach(it=>{const r=itemNutr(it);k+=r.k;p+=r.p});return {k,p}}
function mealPan(rec){const out={};(rec.items||[]).forEach(it=>{const F=it.f&&FOODS[it.f];if(!F||!F.pan)return;for(const i in F.pan)out[i]=(out[i]||0)+F.pan[i]*(it.q||0)});return out}
function itemLabel(it){if(!it.f)return esc(it.n||'Item');const F=FOODS[it.f];return esc(F.n)}

function mealRow(k,d,m){

      <p><span class="eyebrow" style="letter-spacing:.06em">Sugestão</span> ${esc(menuFor(k)[m.id])}</p>
      <span class="mac">${custom?`Registrado: ${f0(r.p)} g prot · ${f0(r.k)} kcal`:`${m.p} g prot · ${m.k} kcal`}</span></div>
    <div class="meal-btns"><button class="toggle ${v===true?'on':''}" data-act="meal" data-m="${m.id}">${v===true?'Comi o sugerido':'Comi o sugerido'}</button>
      <button class="toggle ${custom?'on':''}" data-act="mcustom" data-m="${m.id}">${custom?(open?'Fechar':'Editar o que comi'):'Comi outra coisa'}</button></div></div>`;
  if(custom&&!open)h+=`<div class="small muted">${(v.items||[]).map(it=>`${itemLabel(it)}${it.f?` ${String(it.q).replace('.',',')} ${FOODS[it.f].u==='g'?'g':FOODS[it.f].lb}`:''}`).join(' · ')||'Nada registrado ainda'}</div>`;

      ${favs.length?`<div class="field"><span>Favoritos</span><div class="chips">${favs.map((f,i)=>`<button class="chip" data-act="mfav" data-m="${m.id}" data-i="${i}">★ ${esc(f.n)}</button>`).join('')}</div></div>`:''}

          <label class="field"><span>prot (g)</span><input class="inp" id="mmp-${k}-${m.id}" inputmode="numeric"></label>
          <button class="btn ghost" data-act="mman" data-m="${m.id}">Adicionar</button></div></div>
      <div class="block"><div class="mono"><b>${f0(r.p)} g prot · ${f0(r.k)} kcal</b> <span class="muted small">meta da refeição: ${m.p} g · ${m.k} kcal</span></div></div>
      ${r.p<m.p*0.7&&(v.items||[]).length?`<div class="note amber small">Proteína baixa para esta refeição. Some 2 ovos, 2 claras ou 50 g de frango.</div>`:''}
      <div class="row" style="gap:8px"><input class="inp" id="mfn-${k}-${m.id}" style="flex:1 1 180px;font-family:var(--f-body)" placeholder="Nome do favorito">
        <button class="btn ghost" data-act="msavefav" data-m="${m.id}" ${(v.items||[]).length?'':'disabled'}>Salvar como favorito</button>
        <button class="linkbtn" data-act="mclear" data-m="${m.id}">Apagar registro</button></div>
    </div>`;
  }
  return h+'</div>';
}
async function estimateMeal(k,slot){
  const el=document.getElementById(`mt-${k}-${slot}`);const txt=el&&el.value.trim();if(!txt){el&&el.focus();return}
  if(S.estBusy)return;S.estBusy=slot;
  const table=Object.keys(FOODS).map(f=>{const F=FOODS[f];return `${f}: ${F.n} (q em ${F.u==='g'?'gramas; valores por 100 g':F.lb+'; valores por unidade'}: ${F.k} kcal, ${F.p} g proteína)`}).join('\n');
  const prompt=`Estime a refeição descrita por um adulto brasileiro. Quebre em itens. Para cada item, use um id da tabela quando o alimento for equivalente e informe q na unidade da tabela; se não houver equivalente, use "food": null e estime kcal e proteína do item. Sem quantidade informada, use porções caseiras brasileiras típicas.
Responda somente com JSON neste formato: {"itens":[{"nome":"texto curto","food":"id ou null","q":número,"kcal":número,"proteina_g":número}]}

Tabela:
${table}

Refeição: ${txt}`;
  try{
    const res=estimarLocal(txt);if(res.nao.length)setTimeout(()=>toast('Não reconheci: '+esc(res.nao.join(', '))+'. Adicione pela lista ou em "Item que não está na lista"'),2600);
    const its=Array.isArray(res&&res.itens)?res.itens:[];
    if(!its.length)throw {code:'empty'};
    mutate(k,d=>{let rec=d.meals[slot];if(!rec||rec===true)rec={c:1,items:[]};rec.items=rec.items||[];rec.txt=txt;
      its.forEach(it=>{const q=+it.q;if(it.food&&FOODS[it.food]&&q>0)rec.items.push({f:it.food,q:Math.round(q*10)/10});else rec.items.push({n:String(it.nome||'Item').slice(0,60),k:Math.round(+it.kcal||0),p:Math.round(+it.proteina_g||0)})});
      d.meals[slot]=rec});
    toast('Estimado pela tabela. Confira as quantidades');
  }catch(e){
    if(e&&e.code==='not_granted'){S.sample=null}
    toast('Não reconheci nenhum alimento. Use a lista ou escreva, por exemplo, "120 g de frango, 4 colheres de arroz"');
  }
  S.estBusy=null;render();
}

const CATS=['Proteínas','Legumes e verduras','Frutas','Despensa'];
const SLOTS=['cafe','almoco','lanche','jantar'];
const blankPantry=()=>({items:{},waste:[],horizon:4,dinners:5,updated:0,favs:clone(DEFAULT_FAVS),skip:{}});
S.pantry=blankPantry();
let _cc=null;
function slotUse(k,slot){const m=MENUS[menuIdx(k)][slot];const u={...m.u};const ex=SLOT_EXTRA[slot];if(ex)for(const i in ex)u[i]=(u[i]||0)+ex[i];return u}
function dayActual(k){
  const t=todayKey();if(k>t)return {};const d=S.days[k];const logged=d&&MEALS.some(m=>(d.meals||{})[m.id]);const out={};
  SLOTS.forEach(sl=>{let f=0;if(logged)f=(d.meals||{})[sl]?1:0;else if(k<t&&!inTrip(k))f=sl==='jantar'?S.pantry.dinners/7:1;
    const v=logged&&(d.meals||{})[sl];if(v&&v!==true){const u=mealPan(v);for(const i in u)out[i]=(out[i]||0)+u[i];return}
    if(f){const u=slotUse(k,sl);for(const i in u)out[i]=(out[i]||0)+u[i]*f}});
  return out;
}
function dayPlan(k){if(inTrip(k))return {};const out={};const d=S.days[k];const t=todayKey();
  SLOTS.forEach(sl=>{if(k===t&&d&&(d.meals||{})[sl])return;const f=sl==='jantar'?S.pantry.dinners/7:1;const u=slotUse(k,sl);for(const i in u)out[i]=(out[i]||0)+u[i]*f});return out}
function consumed(id,from,to){if(!_cc)_cc={};let s=0;for(let k=from;k<=to;k=addDays(k,1)){if(!_cc[k])_cc[k]=dayActual(k);s+=_cc[k][id]||0}return s}
function stock(id){const it=S.pantry.items[id];if(!it)return 0;const used=consumed(id,it.at,todayKey())-(it.c0||0);return Math.max(0,it.base-used)}
function planNeed(id,days,start){let s=0;for(let i=0;i<days;i++){const k=addDays(start||todayKey(),i);s+=dayPlan(k)[id]||0}return s}
function dailyRate(id){const n=planNeed(id,7,addDays(todayKey(),1));return n/7}
function allocLots(id){const it=S.pantry.items[id];if(!it||!it.lots)return [];let rem=stock(id);const out=[];
  for(let i=it.lots.length-1;i>=0&&rem>0.0001;i--){const q=Math.min(it.lots[i].q,rem);out.unshift({q,d:it.lots[i].d,i});rem-=q}return out}
function pSet(id,q){const t=todayKey();const it=S.pantry.items[id]||{};it.base=Math.max(0,q);it.at=t;it.c0=consumed(id,t,t);it.lots=q>0?[{q,d:t}]:[];S.pantry.items[id]=it}
function pBuy(id,q){const t=todayKey();const cur=stock(id);const keep=allocLots(id).map(l=>({q:l.q,d:l.d}));const it=S.pantry.items[id]||{};
  it.base=cur+q;it.at=t;it.c0=consumed(id,t,t);it.lots=[...keep,{q,d:t}];it.bought=t;S.pantry.items[id]=it}
function pDiscard(id,lotIdx){const it=S.pantry.items[id];const al=allocLots(id);const l=al.find(x=>x.i===lotIdx);if(!l)return;const t=todayKey();const cur=stock(id);
  S.pantry.waste.push({id,q:l.q,d:t});const keep=al.filter(x=>x.i!==lotIdx).map(x=>({q:x.q,d:x.d}));it.base=Math.max(0,cur-l.q);it.at=t;it.c0=consumed(id,t,t);it.lots=keep}
function roundBuy(I,q){if(q<=0)return 0;if(I.pack)return Math.ceil(q/I.pack)*I.pack;const st=I.step||1;return Math.ceil(q/st-0.001)*st}
function fmtQty(I,q){if(I.packLbl){const n=Math.round(q/I.pack);return `${n} ${I.packLbl}${n>1?'s':''}`}if(I.u==='g')return q>=1000?`${f1(q/1000).replace(',0','')} kg`:`${Math.round(q)} g`;if(I.u==='ml')return `${Math.round(q)} ml`;
  const n=Math.round(q*10)/10;const word={un:n===1?'unidade':'unidades',pote:n===1?'pote':'potes',maço:n===1?'maço':'maços'}[I.u];return `${String(n).replace('.',',')} ${word}`}
function fmtStock(I,q){if(I.u==='g'&&q<1000)return `${Math.round(q)} g`;if(I.u==='un'||I.u==='pote'||I.u==='maço'){const n=Math.round(q*10)/10;return `${String(n).replace('.',',')} ${I.u==='un'?'un':I.u}`}return fmtQty(I,q)}
function shoppingList(){
  const H=S.pantry.horizon,t=todayKey(),out=[];let repo=null;
  for(const id in ITEMS){const I=ITEMS[id];const st=stock(id);
    let days=H,trunc=false;
    if(I.long)days=Math.max(H,14);
    else if(!I.freeze&&I.life<H){days=I.life;trunc=true}
    if((S.pantry.skip||{})[id])continue;
    const recent=consumed(id,addDays(t,-7),addDays(t,-1))/7;
    const need=Math.max(planNeed(id,days,t),recent*days);const gap=need-st;
    if(gap<=0.05*(I.step||1))continue;
    const q=roundBuy(I,gap);if(!q)continue;
    if(trunc){const r=addDays(t,I.life);if(!repo||r<repo)repo=r}
    const notes=[];if(I.note)notes.push(I.note);if(trunc)notes.push(`Dura ${I.life} dias: o resto vai na reposição`);
    out.push({id,I,q,need,st,notes});
  }
  return {items:out,repo};
}
function pantryAlerts(){const t=todayKey(),use=[],gone=[],freeze=[],low=[];
  for(const id in S.pantry.items){const I=ITEMS[id];if(!I)continue;const al=allocLots(id);
    if(I.freeze){if(S.pantry.items[id].bought===t&&stock(id)>0)freeze.push(I.n.split(' (')[0]);}
    else al.forEach(l=>{const left=I.life-diffDays(l.d,t);if(left<0)gone.push({id,I,l});else if(left<=1)use.push({id,I,l,left})});
    const r=dailyRate(id);if(r>0&&stock(id)>0&&stock(id)<r*1.0)low.push(I.n.split(' (')[0]);}
  return {use,gone,freeze,low}}

    ${list.items.length?CATS.filter(c=>byCat(c).length).map(c=>`<div><div class="eyebrow" style="margin:6px 0 2px">${c}</div>${byCat(c).map(x=>`<div class="buy-row"><div style="min-width:0"><b>${esc(x.I.n)}</b> <span class="mono small muted">sugerido ${fmtQty(x.I,x.q)}</span>${x.notes.length?`<p class="small muted" style="margin:2px 0 0">${esc(x.notes.join(' · '))}</p>`:''}${x.st>0?`<p class="small muted" style="margin:2px 0 0">Em casa: ${fmtStock(x.I,x.st)}</p>`:''}</div>
  <label class="pin"><input id="pq-${x.id}" inputmode="decimal" value="${x.I.u==='g'||x.I.u==='ml'?Math.round(x.q):Math.round(x.q*10)/10}"><span>${x.I.u==='un'?'un':x.I.u}</span></label>
  <div class="buy-btns"><button class="toggle" data-act="pbuy" data-id="${x.id}" data-q="${x.q}">Comprei</button><button class="toggle" data-act="phave" data-id="${x.id}" data-q="${x.q}">Já tenho</button><button class="linkbtn" data-act="pskip" data-id="${x.id}">Não uso</button></div></div>`).join('')}</div>`).join(''):`<div class="note good"><b>Nada a comprar</b> para os próximos ${P.horizon} dias.</div>`}
    ${list.repo&&list.items.length?`<div class="small muted">Reposição sugerida de frescos: <b style="color:var(--ink)">${fmtDate(list.repo)}</b>.</div>`:''}
    ${list.items.length?`<div class="row"><button class="btn" data-act="pcopy">Copiar para o Lembretes</button><button class="btn ghost" data-act="pbuyall">Comprei tudo</button></div>
    <div class="small muted">Cole dentro da sua lista de compras: o app Lembretes cria um item por linha. Depois da compra, ajuste a quantidade de cada item e toque em "Comprei". Já tinha em casa? "Já tenho". Não usa ou trocou por outra coisa? "Não uso".</div>
    <textarea id="pcopybox" class="inp" rows="6" readonly hidden style="font-family:var(--f-mono);font-size:13px">${esc(copyText(list))}</textarea>`:''}
  </section>`;
  // despensa
  h+=`<details class="card" ${!tracked?'open':''}><summary><b>Despensa</b> <span class="small muted">· estoque estimado em casa</span></summary>
    <div class="small muted">O estoque cai sozinho conforme você marca as refeições como comidas. Corrija o número quando estiver errado, ou toque em "Acabou".</div>
    ${CATS.map(c=>`<div><div class="eyebrow" style="margin:8px 0 2px">${c}</div>${Object.keys(ITEMS).filter(id=>ITEMS[id].c===c).map(id=>{const I=ITEMS[id];const st=stock(id);const r=dailyRate(id);const cov=r>0?st/r:null;
      const al=allocLots(id);const oldest=al[0];const left=oldest&&!I.freeze?I.life-diffDays(oldest.d,t):null;
      return `<div class="pantry-row"><div style="min-width:0"><b>${esc(I.n)}</b><div class="small muted">${st>0?(cov!=null?`dá para ${cov<1?'menos de 1 dia':Math.floor(cov)+(Math.floor(cov)===1?' dia':' dias')}`:'sem uso nos próximos dias'):'sem estoque'}${left!=null&&st>0?` · ${left<0?'passou do prazo':left===0?'vence hoje':`bom por ${left} ${left===1?'dia':'dias'}`}`:''}</div></div>
        <label class="pin"><input id="p-${id}" inputmode="decimal" data-pf="${id}" value="${st>0?(I.u==='g'||I.u==='ml'?Math.round(st):Math.round(st*10)/10):''}" placeholder="0"><span>${I.u==='un'?'un':I.u}</span></label>
        ${(S.pantry.skip||{})[id]?`<button class="toggle" data-act="punskip" data-id="${id}">Voltar a usar</button>`:`<button class="toggle" data-act="pzero" data-id="${id}" ${st>0?'':'disabled'}>Acabou</button>`}</div>`}).join('')}</div>`).join('')}
  </details>`;
  h+=`<section class="card"><h3>Desperdício no mês</h3>
    ${wasteMonth.length?`<div class="small">${wasteMonth.map(w=>`${esc(ITEMS[w.id].n)}: ${fmtStock(ITEMS[w.id],w.q)} em ${fmtShort(w.d)}`).join(' · ')}</div><div class="small muted">Item que estraga duas vezes: compre menos dele ou mude para a versão congelada.</div>`:`<div class="small muted">Nada jogado fora neste mês. Quando algo passar do prazo, toque em "Joguei fora" no alerta: o registro mostra onde a lista está errando.</div>`}
  </section>`;
  return h;
}

/* ---------- timer ---------- */
const TM={phases:[],idx:0,end:0,total:0,iv:null,audio:null,lock:null};
function ensureAudio(){try{if(!TM.audio){const C=window.AudioContext||window.webkitAudioContext;if(C)TM.audio=new C()}if(TM.audio&&TM.audio.state==='suspended')TM.audio.resume()}catch(e){}}
function beep(times=2,freq=880){try{const a=TM.audio;if(!a)return;for(let i=0;i<times;i++){const o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.connect(g);g.connect(a.destination);const t0=a.currentTime+i*0.22;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);o.start(t0);o.stop(t0+0.2)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}}
async function wake(){try{if(navigator.wakeLock&&!TM.lock){TM.lock=await navigator.wakeLock.request('screen');TM.lock.addEventListener('release',()=>{TM.lock=null})}}catch(e){}}
function startTimer(phases){try{window.parent.postMessage({orbitus:'timer'},location.origin)}catch(e){}ensureAudio();wake();TM.phases=phases;TM.idx=0;runPhase()}
function runPhase(){const p=TM.phases[TM.idx];TM.total=p.sec;TM.end=Date.now()+p.sec*1000;clearInterval(TM.iv);TM.iv=setInterval(tick,250);tick()}
function tick(){
  const el=document.getElementById('timer');const p=TM.phases[TM.idx];if(!p)return stopTimer();
  const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000));
  if(left<=0){beep(p.hard?3:2,p.hard?660:880);const cb=p.onEnd;TM.idx++;if(TM.idx<TM.phases.length)runPhase();else stopTimer();if(cb)try{cb()}catch(e){}return}
  el.hidden=false;document.body.classList.add('timing');el.className=p.hard?'hard':'';
  const nxt=TM.phases[TM.idx+1];
  el.innerHTML=`<div class="wrap"><div><div class="tl">${esc(p.label)}${TM.phases.length>1?` · ${TM.idx+1}/${TM.phases.length}`:''}</div><div class="tt num">${Math.floor(left/60)}:${pad(left%60)}</div>${nxt?`<div class="tl" style="opacity:.6">Depois: ${esc(nxt.label)}</div>`:''}</div>
    <div class="tc"><button data-act="t-15">−15</button><button data-act="t+15">+15</button><button data-act="t-skip">${TM.phases.length>1?'Próxima':'Pular'}</button><button data-act="t-stop" aria-label="Fechar">✕</button></div>
    <div class="tb"><i style="width:${(1-left/TM.total)*100}%"></i></div></div>`;
}
function stopTimer(){clearInterval(TM.iv);TM.iv=null;TM.phases=[];const el=document.getElementById('timer');el.hidden=true;document.body.classList.remove('timing');try{TM.lock&&TM.lock.release()}catch(e){}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const k=S.sel;
  switch(a){
    case 'tab':S.tab=b.dataset.tab;render();window.scrollTo({top:0});break;
    case 'day':S.sel=addDays(S.sel,+b.dataset.n);render();break;
    case 'today':S.sel=todayKey();render();break;
    case 'figzoom':S.zoom=S.zoom===b.dataset.ex?null:b.dataset.ex;render();break;
    case 'goto':S.sel=b.dataset.k;S.tab='hoje';render();window.scrollTo({top:0});break;
    case 'water':mutate(k,d=>{const n=+b.dataset.n;d.water=d.water===n?n-1:n});break;
    case 'habit':mutate(k,d=>{d.habits=d.habits||{};d.habits[b.dataset.h]=!d.habits[b.dataset.h]});break;
    case 'mesadata':S.mesaData=b.dataset.d;render();break;
    case 'pqpara':S.pqPara=b.dataset.p;render();break;
    case 'perguntar':{const el=document.getElementById('pq-txt');const tx=el&&el.value.trim();if(!tx){el&&el.focus();break}
      apiPost('/api/treino/pergunta',{para:S.pqPara||'mesa',texto:tx}).then(()=>{toast('Pergunta enviada. A resposta sai no parecer das 21:47');el.value='';el.blur();initCloud()}).catch(e=>toast(esc(e.message)));break}
    case 'local':{const l=b.dataset.l;mutate(k,d=>{const auto=(S.locais||[]).find(x=>k>=x.de&&k<=x.ate);const base=auto?auto.local:'casa';if(l===base){delete d.local;delete d.localNome}else{d.local=l;d.localNome=l==='academia'?'Academia':''}});break}
    case 'corrida':mutate(k,d=>{d.workout.corrida=!d.workout.corrida});break;
    case 'pilates':mutate(k,d=>{d.workout.pilates=!d.workout.pilates});break;
    case 'yoga':mutate(k,d=>{d.workout.yoga=!d.workout.yoga;d.workout.rec=d.workout.yoga?'ioga':null});break;
    case 'warm':mutate(k,d=>{d.workout.warm=!d.workout.warm});break;
    case 'remo':mutate(k,d=>{d.workout.remo=!d.workout.remo});break;
    case 'cond':mutate(k,d=>{const c=b.dataset.c;if(d.workout.remo&&(d.workout.cond||'remo')===c){d.workout.remo=false;d.workout.cond=null}else{d.workout.remo=true;d.workout.cond=c}});break;
    case 'rec':mutate(k,d=>{const r=b.dataset.r;if(d.workout.yoga&&(d.workout.rec||'ioga')===r){d.workout.yoga=false;d.workout.rec=null}else{d.workout.yoga=true;d.workout.rec=r}});break;
    case 'remoOn':mutate(k,d=>{d.workout.remoOn=true});break;
    case 'letter':mutate(k,d=>{const l=b.dataset.l;const auto=autoSession(k);d.workout.letter=l===auto?null:l});break;
    case 'finish':{const was=getDay(k).workout.done;mutate(k,d=>{d.workout.done=!d.workout.done});if(!was)toast(`Treino concluído<br><span style="font-weight:500">${esc(phraseRandom())}</span>`,true);break}
    case 'meal':{const sl=b.dataset.m;S.mealEdit=null;mutate(k,d=>{d.meals=d.meals||{};d.meals[sl]=d.meals[sl]===true?false:true});break}
    case 'mcustom':{const sl=b.dataset.m;const v=(getDay(k).meals||{})[sl];if(v&&v!==true){S.mealEdit=S.mealEdit===sl?null:sl;render()}else{S.mealEdit=sl;mutate(k,d=>{d.meals=d.meals||{};d.meals[sl]={c:1,items:[]}})}break}
    case 'madd':{const sl=b.dataset.m,f=b.dataset.f;mutate(k,d=>{const r=d.meals[sl];r.items=r.items||[];const ex=r.items.find(x=>x.f===f);if(ex)ex.q=+(ex.q+FOODS[f].def).toFixed(1);else r.items.push({f,q:FOODS[f].def})});break}
    case 'mrm':{const sl=b.dataset.m,i=+b.dataset.i;mutate(k,d=>{d.meals[sl].items.splice(i,1)});break}
    case 'mfav':{const sl=b.dataset.m,i=+b.dataset.i;const fav=(S.pantry.favs||[])[i];if(!fav)break;mutate(k,d=>{const r=d.meals[sl];r.items=(r.items||[]).concat(clone(fav.items))});toast(`${esc(fav.n)} adicionado`);break}
    case 'msavefav':{const sl=b.dataset.m;const v=getDay(k).meals[sl];const el=document.getElementById(`mfn-${k}-${sl}`);const n=(el&&el.value.trim())||'';if(!n){el&&el.focus();toast('Dê um nome ao favorito');break}
      pmutate(P=>{P.favs=P.favs||[];P.favs.push({n:n.slice(0,40),items:clone(v.items||[])})});toast(`★ ${esc(n)} salvo nos favoritos`);break}
    case 'mclaude':estimateMeal(k,b.dataset.m);break;
    case 'mman':{const sl=b.dataset.m;const n=document.getElementById(`mmn-${k}-${sl}`).value.trim(),kc=num(document.getElementById(`mmk-${k}-${sl}`).value),pr=num(document.getElementById(`mmp-${k}-${sl}`).value);
      if(!n||kc==null){document.getElementById(n?`mmk-${k}-${sl}`:`mmn-${k}-${sl}`).focus();break}mutate(k,d=>{d.meals[sl].items.push({n:n.slice(0,60),k:kc,p:pr||0})});break}
    case 'mclear':{const sl=b.dataset.m;S.mealEdit=null;mutate(k,d=>{d.meals[sl]=false});break}
    case 'extra':{const x=EXTRAS[+b.dataset.i];mutate(k,d=>{d.extras=d.extras||[];d.extras.push({n:x.n,k:x.k,p:x.p,t:x.t||null})});break}
    case 'rmextra':mutate(k,d=>{d.extras.splice(+b.dataset.i,1)});break;
    case 'custom':{const n=document.getElementById('c-name').value.trim(),kc=num(document.getElementById('c-k').value),p=num(document.getElementById('c-p').value);
      if(!n||kc==null){document.getElementById(n?'c-k':'c-name').focus();return}
      mutate(k,d=>{d.extras=d.extras||[];d.extras.push({n,k:kc,p:p||0,t:null})});break}
    case 'set':{const id=b.dataset.ex,i=+b.dataset.i,rest=+b.dataset.rest;
      const kgEl=document.getElementById(`kg-${k}-${id}-${i}`),rpEl=document.getElementById(`rp-${k}-${id}-${i}`);
      const nowDone=setDone(k,id,i,kgEl?num(kgEl.value):null,rpEl?num(rpEl.value):null);
      if(nowDone&&rest>0)startTimer([{label:rest<30?'Troque de exercício':`Descanso · ${EX[id].n}`,sec:rest}]);
      break}
    case 'tset':{const id=b.dataset.ex,i=+b.dataset.i,rest=+b.dataset.rest;const rpEl=document.getElementById(`rp-${k}-${id}-${i}`);const sec=num(rpEl&&rpEl.value)||EX[id].lo;
      const ph=[{label:'Prepare-se',sec:5},{label:`${EX[id].n} · série ${i+1}`,sec,hard:true,onEnd:()=>setDone(k,id,i,null,sec,true)}];if(rest>0)ph.push({label:`Descanso · ${EX[id].n}`,sec:rest});startTimer(ph);break}
    case 'allsets':{const id=b.dataset.ex;const ex=EX[id];
      mutate(k,d=>{d.workout.sets=d.workout.sets||{};const arr=d.workout.sets[id]=d.workout.sets[id]||[];for(let i=0;i<ex.s;i++){const kgEl=document.getElementById(`kg-${k}-${id}-${i}`),rpEl=document.getElementById(`rp-${k}-${id}-${i}`);arr[i]={kg:kgEl?num(kgEl.value):null,reps:rpEl?num(rpEl.value):null,done:true}}});
      checkWorkoutComplete(k);break}
    case 'warmtimer':startTimer([{label:'Aquecimento: remo leve',sec:300,onEnd:()=>mutate(k,d=>{d.workout.warm=true})}]);break;
    case 'review':S.reviewOpen=k;render();break;
    case 'coach':askCoach(k);break;
    case 'phor':pmutate(P=>{P.horizon=+b.dataset.n});break;
    case 'pdin':pmutate(P=>{P.dinners=Math.max(0,Math.min(7,P.dinners+ +b.dataset.n))});break;
    case 'phave':{const id=b.dataset.id;const el=document.getElementById('pq-'+id);const q=num(el&&el.value)??+b.dataset.q;_cc=null;const st=stock(id);pmutate(()=>pSet(id,st+q));toast(`${esc(ITEMS[id].n.split(' (')[0])}: estoque atualizado`);break}
    case 'pskip':{const id=b.dataset.id;pmutate(P=>{P.skip=P.skip||{};P.skip[id]=true});toast(`${esc(ITEMS[id].n.split(' (')[0])} saiu da lista`);break}
    case 'punskip':{const id=b.dataset.id;pmutate(P=>{if(P.skip)delete P.skip[id]});break}
    case 'pbuy':{const id=b.dataset.id;const el=document.getElementById('pq-'+id);const q=num(el&&el.value)??+b.dataset.q;_cc=null;pmutate(()=>pBuy(id,q));toast(`${esc(ITEMS[id].n.split(' (')[0])} no estoque`);break}
    case 'pbuyall':{_cc=null;const L=shoppingList();const qs=L.items.map(x=>{const el=document.getElementById('pq-'+x.id);return num(el&&el.value)??x.q});pmutate(()=>{L.items.forEach((x,i)=>{_cc=null;if(qs[i]>0)pBuy(x.id,qs[i])})});toast(`Compra registrada<br><span style="font-weight:500">${L.items.length} itens no estoque</span>`,true);break}
    case 'pcopy':{_cc=null;const txt=copyText(shoppingList());const box=document.getElementById('pcopybox');
      const fallback=()=>{if(box){box.hidden=false;box.focus();box.select()}toast('Selecionei a lista: copie manualmente')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada. Cole no Lembretes'),fallback)}catch(e){fallback()}break}
    case 'pzero':{const id=b.dataset.id;_cc=null;pmutate(()=>pSet(id,0));break}
    case 'pdiscard':{const id=b.dataset.id,i=+b.dataset.i;_cc=null;pmutate(()=>pDiscard(id,i));break}
    case 'pok':{const id=b.dataset.id;const I=ITEMS[id];_cc=null;pmutate(P=>{const it=P.items[id];if(it&&it.lots)it.lots.forEach(l=>{if(I.life-diffDays(l.d,todayKey())<0)l.d=addDays(todayKey(),-(I.life-1))})});break}
    case 'menushift':mutate(k,d=>{d.menuShift=((d.menuShift||0)+1)%14});break;
    case 'focus':{const el=document.getElementById(b.dataset.id);if(el){el.focus();el.scrollIntoView({block:'center'})}break}
    case 'intervals':{const ph=[{label:'Remo leve · aquecimento',sec:180}];for(let i=1;i<=8;i++){ph.push({label:`Forte ${i}/8`,sec:30,hard:true});ph.push({label:`Leve ${i}/8`,sec:90})}ph.push({label:'Desaquecimento',sec:180});startTimer(ph);break}
    case 't-15':TM.end-=15000;tick();break;
    case 't+15':TM.end+=15000;TM.total+=15;tick();break;
    case 't-skip':TM.end=Date.now();tick();break;
    case 't-stop':stopTimer();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;const k=S.sel;
  if(el.dataset.mi){const sl=el.dataset.mi,i=+el.dataset.i;const v=num(el.value);mutate(k,d=>{const it=d.meals[sl]&&d.meals[sl].items[i];if(it)it.q=v!=null&&v>0?v:0});return}
  if(el.dataset.pf){const id=el.dataset.pf;const v=num(el.value);_cc=null;pmutate(()=>pSet(id,v||0));return}
  if(el.dataset.f){const f=el.dataset.f;const v=num(el.value);mutate(k,d=>{d[f]=f==='steps'&&v!=null?Math.round(v):v})}
  else if(el.dataset.set){const id=el.dataset.ex,i=+el.dataset.i,f=el.dataset.set;
    mutate(k,d=>{d.workout.sets=d.workout.sets||{};const arr=d.workout.sets[id]=d.workout.sets[id]||[];while(arr.length<=i)arr.push(null);const r=arr[i]||{done:false};r[f]=num(el.value);
      if(f==='kg'&&r.reps==null){const rp=document.getElementById(`rp-${k}-${id}-${i}`);r.reps=rp?num(rp.value):null}
      if(f==='reps'&&r.kg==null){const kg=document.getElementById(`kg-${k}-${id}-${i}`);r.kg=kg?num(kg.value):null}
      arr[i]=r},false)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.target.blur()}});

/* ---------- figure animation ---------- */
let figLast=0;
function treinoVisivel(){if(document.hidden)return false;const f=window.frameElement;if(!f)return true;try{if(!f.getClientRects().length)return false;const r=f.getBoundingClientRect();return r.bottom>0&&r.top<parent.innerHeight}catch(e){return true}}
function figLoop(now){
  if(!treinoVisivel()){setTimeout(()=>requestAnimationFrame(figLoop),500);return}
  if(now-figLast>40){desenharAgentes(now/1000);figLast=now;const ph=(now%2800)/2800;const ez=x=>0.5-0.5*Math.cos(Math.PI*x);
    const t=ph<.4?ez(ph/.4):ph<.5?1:ph<.9?1-ez((ph-.5)/.4):0;const vh=window.innerHeight;
    document.querySelectorAll('svg.fig[data-ex]').forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;el.innerHTML=figInner(el.dataset.ex,t)})}
  requestAnimationFrame(figLoop)}

/* ---------- boot ---------- */
if(window.parent!==window)document.documentElement.classList.add('embed');
lsLoad();
if(S.sel<PLAN.gridStart)S.sel=PLAN.gridStart;
render();
if(!REDUCE)requestAnimationFrame(figLoop);else setTimeout(()=>desenharAgentes(0),300);
setInterval(()=>{if(!isTyping()&&S.tab==='hoje'&&!S.coachBusy)render()},5*60*1000);
initCloud();
</script>
